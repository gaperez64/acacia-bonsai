name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A new push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CXX: g++-14

jobs:
  # Cheap, and it gates everything: an invalid registry would make every
  # build below answer the wrong question. It also publishes the shipped
  # configuration list, so the group stays the pointer here too rather than
  # being duplicated as a hardcoded matrix.
  registry:
    runs-on: ubuntu-24.04
    outputs:
      shipped: ${{ steps.group.outputs.shipped }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the configuration registry
        run: python3 scripts/acacia-config.py validate
      - name: Publish the shipped configuration list
        id: group
        run: |
          shipped=$(python3 scripts/acacia-config.py list-group docker_default \
                    | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "shipped=${shipped}" >> "$GITHUB_OUTPUT"
          echo "shipped configurations: ${shipped}"

  # The unoptimized arm. Keeps an -O0 build in every run so the assertions and
  # UB manifestations that only appear without optimization still get exercised,
  # and runs the C++ unit suite, which guards the newest solver code and which
  # CI previously compiled on every run and then never executed.
  debug:
    needs: registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, submodules: true}
      - uses: ./.github/actions/setup-packages
      - uses: ./.github/actions/setup-spot
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-debug, max-size: 500M}
      - name: Compile and test the debug configuration
        run: |
          jobs="$(nproc)"
          export BENCHMARK_COMPILE_JOBS="$jobs"
          ./self-benchmark.sh -c base -j -b unit
          rm -f build_base/benchmarked
          ./self-benchmark.sh -c base -j -b ab/tiny
      - name: Test version reporting
        run: meson test -C build_base --suite version
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: logs-debug, path: _bm-logs/}

  # The optimized arms. buildtype is not 'release', so the project's
  # b_ndebug=if-release leaves assert() and _GLIBCXX_ASSERTIONS enabled: these
  # run the same instances with the same checks, just not at -O0.
  checked:
    needs: registry
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Almost all of a suite's wall clock is instances sitting at the
        # timeout cap rather than instances being solved, so the lever is how
        # many run at once. That parallelism comes from sharding with Meson's
        # --slice, one shard per runner, rather than from running several
        # solvers inside one runner: a shard gets the whole machine's memory,
        # where four solvers sharing one would get a quarter each. synthesis is
        # much the largest suite and takes eight shards; the others run whole.
        include:
          - {suite: ab/small, slice: ''}
          - {suite: ab/issue54, slice: ''}
          - {suite: synthesis, slice: '1/8'}
          - {suite: synthesis, slice: '2/8'}
          - {suite: synthesis, slice: '3/8'}
          - {suite: synthesis, slice: '4/8'}
          - {suite: synthesis, slice: '5/8'}
          - {suite: synthesis, slice: '6/8'}
          - {suite: synthesis, slice: '7/8'}
          - {suite: synthesis, slice: '8/8'}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, submodules: true}
      - uses: ./.github/actions/setup-packages
      - uses: ./.github/actions/setup-spot
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-checked, max-size: 500M}
      - name: Compile and test ${{ matrix.suite }} ${{ matrix.slice }}
        env:
          BENCHMARK_COMPILE_PROFILE: checked
        run: |
          jobs="$(nproc)"
          export BENCHMARK_COMPILE_JOBS="$jobs"
          slice=""
          if [ -n "${{ matrix.slice }}" ]; then
            slice="-s ${{ matrix.slice }}"
          fi
          # shellcheck disable=SC2086  # $slice is deliberately two words or none
          ./self-benchmark.sh -c base -j -b ${{ matrix.suite }} $slice
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-checked-${{ strategy.job-index }}
          path: _bm-logs/

  tlsf:
    needs: registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, submodules: true}
      - uses: ./.github/actions/setup-packages
      - uses: ./.github/actions/setup-spot
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-tlsf, max-size: 500M}
      - name: Compile and test the native TLSF frontend
        run: |
          meson setup build_tlsf_ci --buildtype debug \
            -Dacacia_enable_tlsf_frontend=true
          meson compile -C build_tlsf_ci
          meson test -C build_tlsf_ci --suite tlsf \
            --num-processes 1 --print-errorlogs

  # One job per shipped configuration, so a break in any of them is named
  # rather than hidden inside a single serial step.
  shipped:
    needs: registry
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.registry.outputs.shipped) }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, submodules: true}
      - uses: ./.github/actions/setup-packages
      - uses: ./.github/actions/setup-spot
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-shipped, max-size: 500M}
      - name: Compile and test ${{ matrix.config }}
        run: |
          BENCHMARK_COMPILE_JOBS="$(nproc)"
          export BENCHMARK_COMPILE_JOBS
          ./self-benchmark.sh -L -c ${{ matrix.config }} -j -b ab/tiny
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-shipped-${{ matrix.config }}
          path: _bm-logs/
