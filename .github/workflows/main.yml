name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y zsh meson git g++-14 python-is-python3 \
                    ninja-build gnupg wget python3-pip \
                    pkg-config libffi-dev \
                    libtool valgrind gpg
        sudo pip install --upgrade meson
    - name: Add LRDE Debian repository
      run: |
        sudo mkdir -p /etc/apt/keyrings
        sudo wget https://www.lrde.epita.fr/repo/debian.gpg
        sudo gpg --no-default-keyring --keyring ./tmp-kr.gpg --import debian.gpg
        sudo gpg --no-default-keyring --keyring ./tmp-kr.gpg --export --output /etc/apt/keyrings/lrde.gpg
        sudo sh -c "echo 'deb [signed-by=/etc/apt/keyrings/lrde.gpg] http://www.lrde.epita.fr/repo/debian/ stable/' >> /etc/apt/sources.list"
        sudo apt update
    - name: Install newer libltldl
      run: |
        sudo wget http://launchpadlibrarian.net/815947228/libltdl7_2.5.4-4build1_amd64.deb
        sudo dpkg -i libltdl7_2.5.4-4build1_amd64.deb
        sudo apt -f install
    - name: Install Spot
      run: |
        sudo wget http://www.lre.epita.fr/dload/spot/spot-2.14.4.tar.gz
        tar -xvzf spot-2.14.4.tar.gz
        cd spot-2.14.4
        sudo ./configure --enable-max-accsets=64
        sudo make
        sudo make install
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Compile and test all configurations
      run: |
        export CXX=g++-14
        ./self-benchmark.sh -j 
