name: CI
on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read

env:
  SPOT_VERSION: 2.15.1
  SPOT_PREFIX: /opt/spot_install

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y zsh meson git g++-14 python-is-python3 \
                    ninja-build gnupg wget python3-pip \
                    pkg-config libffi-dev \
                    libtool valgrind gpg flex bison
        sudo pip install --upgrade meson
    - name: Install newer libltldl
      run: |
        set -euo pipefail
        deb=libltdl7_2.5.4-4build1_amd64.deb
        for url in \
          http://archive.ubuntu.com/ubuntu/pool/main/libt/libtool/${deb} \
          http://launchpadlibrarian.net/815947228/${deb}
        do
          if wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-http-error=503,504 -O "${deb}" "${url}"; then
            sudo dpkg -i "${deb}" || sudo apt -f install -y
            sudo apt -f install -y
            exit 0
          fi
        done
        echo "failed to download ${deb}" >&2
        exit 1
    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - name: Prepare Spot install prefix
      run: |
        sudo mkdir -p "$SPOT_PREFIX"
        sudo chown -R "$USER:$USER" "$SPOT_PREFIX"
    - name: Restore Spot cache
      id: spot-cache
      uses: actions/cache/restore@v5
      with:
        # Unlike /usr/local, this prefix is writable during cache restore.
        path: ${{ env.SPOT_PREFIX }}
        key: spot-${{ env.SPOT_VERSION }}-ubuntu24.04-${{ runner.arch }}-gcc14-maxacc64-nopy-v2
    - name: Install Spot
      id: install-spot
      if: steps.spot-cache.outputs.cache-hit != 'true'
      run: |
        wget -q "https://www.lrde.epita.fr/dload/spot/spot-${SPOT_VERSION}.tar.gz"
        tar -xzf "spot-${SPOT_VERSION}.tar.gz"
        cd spot-${SPOT_VERSION}
        CC=gcc-14 CXX=g++-14 ./configure \
          --prefix="$SPOT_PREFIX" \
          --enable-max-accsets=64 \
          --disable-python \
          --disable-static \
          --disable-doxygen
        make -j"$(nproc)"
        make install
    - name: Register and verify Spot installation
      run: |
        echo "$SPOT_PREFIX/bin" >> "$GITHUB_PATH"
        echo "PKG_CONFIG_PATH=$SPOT_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$SPOT_PREFIX/lib" >> "$GITHUB_ENV"
        PKG_CONFIG_PATH="$SPOT_PREFIX/lib/pkgconfig" pkg-config --modversion libspot
        LD_LIBRARY_PATH="$SPOT_PREFIX/lib" "$SPOT_PREFIX/bin/ltlfilt" --version
    - name: Validate the configuration registry
      run: |
        python3 scripts/acacia-config.py validate
    - name: Compile and test a debug configuration
      run: |
        export CXX=g++-14
        ./self-benchmark.sh -c base -j -b ab/tiny
        rm build_base/benchmarked
        ./self-benchmark.sh -c base -j -b ab/small
        rm build_base/benchmarked
        ./self-benchmark.sh -c base -j -b ab/issue54
        rm build_base/benchmarked
        ./self-benchmark.sh -c base -j -b synthesis
    - name: Compile and test the native TLSF frontend
      run: |
        export CXX=g++-14
        meson setup build_tlsf_ci --buildtype debug \
          -Dacacia_enable_tlsf_frontend=true
        meson compile -C build_tlsf_ci
        meson test -C build_tlsf_ci --suite tlsf \
          --num-processes 1 --print-errorlogs
    - name: Compile and test shipped configurations
      run: |
        export CXX=g++-14
        configs=$(python3 scripts/acacia-config.py list-group docker_default | paste -sd, -)
        ./self-benchmark.sh -L -c "$configs" -j -b ab/tiny
    - name: Test version reporting
      run: meson test -C build_base --suite version
    - name: Save Spot cache
      if: >-
        always() &&
        steps.spot-cache.outputs.cache-hit != 'true' &&
        steps.install-spot.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.SPOT_PREFIX }}
        key: ${{ steps.spot-cache.outputs.cache-primary-key }}
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-logs
        path: _bm-logs/
    - name: Upload compilation logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: meson-logs
        path: build_base/meson-logs
