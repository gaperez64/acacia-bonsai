name: Wheels (PyPI)

# Build manylinux wheels for acacia-boomslang on linux/amd64 + linux/arm64
# and a native macOS arm64 wheel, for CPython 3.13 and 3.14, plus an sdist,
# and publish everything to PyPI via trusted publishing when a release is
# published.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  SPOT_VERSION: 2.15.1

jobs:
  build_wheels:
    name: Wheels ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cibw_arch: x86_64
            cibw_build: "cp313-manylinux_* cp314-manylinux_*"
          - arch: arm64
            runner: ubuntu-24.04-arm
            cibw_arch: aarch64
            cibw_build: "cp313-manylinux_* cp314-manylinux_*"
          - arch: macos-arm64
            runner: macos-15
            cibw_arch: arm64
            cibw_build: "cp313-macosx_* cp314-macosx_*"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # Build Spot once per-arch, before any wheels. The container is
          # reused for BEFORE_BUILD / build / REPAIR within a given job so
          # the Spot install at /opt/spot_install is visible throughout.
          CIBW_BEFORE_ALL_LINUX: bash {project}/.github/workflows/wheels-before-all.sh
          CIBW_ENVIRONMENT_LINUX: >-
            PKG_CONFIG_PATH=/opt/spot_install/lib/pkgconfig
            LD_LIBRARY_PATH=/opt/spot_install/lib
            CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
            PATH=/opt/rh/gcc-toolset-14/root/usr/bin:$PATH
          # auditwheel needs to see libspot.so.* at repair time to vendor
          # them into the wheel. Default search path in the container
          # doesn't include /opt/spot_install/lib.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            LD_LIBRARY_PATH=/opt/spot_install/lib
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_BEFORE_ALL_MACOS: bash {project}/.github/workflows/wheels-before-all-macos.sh
          # GCC 14 (needed for experimental/simd in the posets subproject) ships
          # a libstdc++.6.dylib built against macOS 15 on this runner, so the
          # wheel must declare the matching deployment target or delocate will
          # refuse to bundle it.
          CIBW_ENVIRONMENT_MACOS: >-
            PKG_CONFIG_PATH=/opt/spot_install/lib/pkgconfig
            DYLD_LIBRARY_PATH=/opt/spot_install/lib
            CC=/opt/homebrew/bin/gcc-14
            CXX=/opt/homebrew/bin/g++-14
            PATH=/opt/homebrew/bin:$PATH
            MACOSX_DEPLOYMENT_TARGET=15.0
            LDFLAGS="-static-libstdc++ -static-libgcc"
          # delocate finds libspot.dylib via the LC_LOAD_DYLIB path embedded
          # at link time; DYLD_LIBRARY_PATH helps it resolve transitive deps.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH=/opt/spot_install/lib
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import acacia_boomslang; print(acacia_boomslang.__file__)"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # meson-python invokes `meson setup` as part of `meson dist`, which
      # evaluates dependency('libspot') — so even though no compile happens,
      # Spot must be resolvable via pkg-config. Mirrors main.yml's install
      # (without Python bindings).
      - name: Install Spot build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              autoconf automake libtool bison flex pkg-config wget

      - name: Restore Spot cache
        id: spot-cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/libspot*
            /usr/local/lib/libbddx*
            /usr/local/include/spot
            /usr/local/include/bddx*
            /usr/local/lib/pkgconfig/libspot.pc
            /usr/local/lib/pkgconfig/libbddx.pc
          key: spot-${{ env.SPOT_VERSION }}-nopy-sdist-${{ runner.os }}

      - name: Install Spot
        if: steps.spot-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "http://www.lrde.epita.fr/dload/spot/spot-${SPOT_VERSION}.tar.gz"
          tar -xzf "spot-${SPOT_VERSION}.tar.gz"
          cd "spot-${SPOT_VERSION}"
          ./configure --enable-max-accsets=64 --disable-python --disable-static --disable-doxygen
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/acacia-boomslang
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
