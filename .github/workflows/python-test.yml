name: Python interface tests

# Compiles acacia-bonsai with the Python bindings enabled (the same
# configuration used by the Jupyter Docker image) and runs the pytest
# suite. This keeps the showcase examples for issues #51 and #72 from
# silently rotting.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-packages
        with:
          extra: python3-dev swig graphviz

      - name: Install pytest
        run: sudo pip install pytest

      # Spot's Python bindings are needed here, so this asks for a different
      # build than the C++ jobs and gets its own cache key.
      - uses: ./.github/actions/setup-spot
        with:
          python: 'true'

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: python-bindings
          max-size: 500M

      - name: Compile acacia-bonsai with Python bindings
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          export CXX=g++-14
          first=$(python3 scripts/acacia-config.py list-group docker_default | head -1)
          read -r -a preset_args <<< "$(python3 scripts/acacia-config.py meson-args "$first")"
          meson setup build_python --buildtype=release -Dbuild_python=true "${preset_args[@]}" -Dtlsf-tools:cpu=baseline
          meson compile -C build_python -j 2

      - name: Check Python build uses the shipped preset
        run: python3 tests/check-python-preset.py build_python

      - name: Run pytest
        run: |
          SPOT_PY_SITE="$(ls -d /opt/spot_install/lib/python*/site-packages | head -n1)"
          export PYTHONPATH="${SPOT_PY_SITE}:${PWD}/build_python/src/python"
          export LD_LIBRARY_PATH="/opt/spot_install/lib:${PWD}/build_python/src/python"
          python3 -m pytest tests/pytest/ -v
